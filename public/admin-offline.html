<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05081f">
<title>Offline | MOJATECH Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: #05081f; color: #eef0fa; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; }
  .plate { width: 112px; padding: 14px 12px; margin: 0 auto 28px; border-radius: 24px; background: #fff; }
  .plate img { display: block; width: 100%; }
  h1 { margin: 0 0 10px; font-size: 1.5rem; letter-spacing: -0.02em; }
  p { margin: 0 auto 28px; max-width: 30ch; color: #a3a9c6; line-height: 1.5; }
  button { min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: #e0262b; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #8c97ff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="plate"><img src="/brand/mojatech-mark.png" alt="MOJATECH"></div>
    <h1>You're offline</h1>
    <p>The admin needs a connection to load live data. Check your internet, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
